interface:
  display_name: "Excel"
  short_description: "Inspect and review Excel workbooks safely"
  default_prompt: "Use $excel to inspect this workbook with the live Excel tools available on the current host."

dependencies:
  tools:
    - type: "extension"
      value: "excel"
      description: "Live Excel tool namespace on the current host"

# The shared embedded-capability catalog budget is exactly 600 characters.
# It is host-owned and fixed; this pack cannot override it.
# Unknown or malformed activation metadata fails closed for catalog visibility.
activation:
  requires_host_tools: [excel]
  workspace_evidence:
    file_extensions: [".xlsx", ".xlsm", ".xlsb"]
